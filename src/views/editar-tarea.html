<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/static/editar-tareas.css">
    <link type="text/css" rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/bootstrap.min.js"></script>
    <title>Gestor de tareas</title>
   
</head>

<body>
    <div id="header">
        <h1 class="titulo">Gestor de tareas</h1>
        <button id="create-task" onclick="window.location.href = '/ver-tareas/'">Ver tareas</button> 
        <button id="create-task" onclick="window.location.href = '/crear-tarea/'" >Crear tarea</button>
        <button id="create-task" onclick="window.location.href = '/'">Inicio</button>

    </div>
    <div id="page">
        <h1>Editar tareas</h1>
        <div id="resultados"></div>
        <button id="edit">Editar tarea</button>
        <div id="resultadoss"></div>
    </div>
    <script>

        function filterdate(date) {
            let d = new Date(date);
            let month = '' + (d.getUTCMonth() + 1);
            let day = '' + d.getUTCDate() ;
            let year = d.getUTCFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;

            return [year, month, day].join('-');
        }

        let id = new URLSearchParams(window.location.search).get("id");
        let xhr1 = new XMLHttpRequest();
        xhr1.open("GET", "http://localhost:3000/api/tasks/" + id, true);
        xhr1.setRequestHeader("Content-Type", "application/json");
        xhr1.onreadystatechange = function () {
            if (xhr1.readyState === 4 && xhr1.status === 200) {
                let response = JSON.parse(xhr1.responseText);
                console.log(response);
                document.getElementById("resultados").innerHTML =
                `<div class="section"> 
                    <input type="date" id="date" value="${filterdate(response.data.date)}"></input> <br>
                    <input type="text" id="description" value="${response.data.description}"></input> <br>
                    <p>Completado: </p><input type="checkbox" id="complete"></input>
                </div>`;
                document.getElementById("complete").checked = response.data.complete;
            }
        };
        xhr1.send();

        document.getElementById("edit").addEventListener("click", function () {
            const description = document.getElementById("description").value;
            const date = document.getElementById("date").value;
            const complete = document.getElementById("complete").checked;
            let xhr2 = new XMLHttpRequest();
            xhr2.open("PUT", "http://localhost:3000/api/tasks/" + id, true);
            xhr2.setRequestHeader("Content-Type", "application/json");
            xhr2.onreadystatechange = function () {
                if (xhr2.readyState === 4 && xhr2.status === 200) {
                    let response = JSON.parse(xhr2.responseText);
                    console.log(response);
                    if (response.msg == 'actualizado'){
                        document.getElementById("resultadoss").textContent = "Tarea Editada";
                    } setTimeout(() => {
                         document.getElementById("resultadoss").textContent = "";
                    }, 2000);
                }
            };
            xhr2.send(JSON.stringify({ description, date, complete }));
        });

    </script>
</body>

</html>
