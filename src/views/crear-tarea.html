<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/static/crear-tareas.css">
    <link type="text/css" rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/bootstrap.min.js"></script>
    <title>Gestor de tareas</title>
</head>
<body>
    <div id="header">
        <h1 class="titulo">Gestor de tareas</h1>
        <button id="view-task" onclick="window.location.href = '/ver-tareas/'">Ver tareas</button> 
        <button id="create-task" onclick="window.location.href = '/'">Inicio</button>

    </div>
    <div id="page">
        <h1>Crear tarea</h1>
        <form id="task">
            <input type="text" id="description" placeholder="Descripción" required>
            <input type="date" id="date" placeholder="Fecha" required>
            <button type="submit" id="create-tarea">Crear tarea</button>
        </form>
        <br>
        <div id="resultados"></div>
     
        
    </div>
    <script>
        function filterdate(date) {
            let d = new Date(date);
            let month = '' + (d.getUTCMonth() + 1);
            let day = '' + d.getUTCDate();
            let year = d.getUTCFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;

            return [year, month, day].join('-');
        }

        document.getElementById("date").value = filterdate(new Date());

        document.getElementById("task").addEventListener("submit", function(e) {
            e.preventDefault();
            const description = document.getElementById("description").value;
            const date = document.getElementById("date").value;
            var xhr1 = new XMLHttpRequest();
            xhr1.open("POST", "http://localhost:3000/api/tasks/", true);
            xhr1.setRequestHeader("Content-Type", "application/json");
            xhr1.onreadystatechange = function () {
                if (xhr1.readyState === 4 && xhr1.status === 200) {
                    var response = JSON.parse(xhr1.responseText);
                    console.log(response);
                    if (response.msg == 'inserted'){
                        document.getElementById("resultados").textContent = "Tarea creada";
                    } setTimeout(() => {
                         document.getElementById("resultados").textContent = "";
                    }, 2000);
                }
            };
            xhr1.send(JSON.stringify({ description, date }));
        });
    </script>
</body>
</html>
